[package]
name = "torky-desktop"
version.workspace = true
description = "Torky torrent discovery and streaming desktop application"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "torky_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
catalog-client = { path = "../../../crates/catalog-client" }
futures.workspace = true
mainline.workspace = true
mainline-discovery = { path = "../../../crates/mainline-discovery" }
pubky.workspace = true
pubky-adapter = { path = "../../../crates/pubky-adapter" }
qbittorrent-connector = { path = "../../../crates/qbittorrent-connector" }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde.workspace = true
serde_json.workspace = true
stream-gateway = { path = "../../../crates/stream-gateway" }
swarm-protocol = { path = "../../../crates/swarm-protocol" }
swarm-store = { path = "../../../crates/swarm-store" }
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio.workspace = true
torrent-engine = { path = "../../../crates/torrent-engine" }
url.workspace = true

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

